name: Feature Request
description: Suggest an improvement to kora_voice.
title: '[Feature]: '
labels:
- enhancement
- needs-triage
body:
- type: textarea
  id: problem
  attributes:
    label: What problem would this solve?
    description: Describe the current workflow in kora_voice and where it falls short.
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Proposed solution
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Alternatives considered
- type: input
  id: component
  attributes:
    label: Affected component (optional)
    placeholder: For example, Proximity modes, Radio channels, Phone calls, Submix and muffling
- type: checkboxes
  id: checks
  attributes:
    label: Checklist
    options:
    - label: I searched for an existing feature request.
      required: true
